spring.application.name=medsinc-web-integrado

# Configure as variáveis MEDSINC_DB_URL, MEDSINC_DB_USER e MEDSINC_DB_PASSWORD no ambiente.
spring.datasource.url=${MEDSINC_DB_URL}
spring.datasource.username=${MEDSINC_DB_USER}
spring.datasource.password=${MEDSINC_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.sql.init.mode=never
spring.jackson.time-zone=America/Sao_Paulo

server.error.include-message=never
server.error.include-binding-errors=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Diretório protegido para arquivos SQL de backup gerados pelo servidor.
medsinc.backup.directory=${MEDSINC_BACKUP_DIR:./backups}
